# Reference nginx vhost for apps/api.
#
# This is the config the deployed API is meant to run behind. It is committed
# so the vhost is reviewable rather than hand-edited on the box, and so the two
# settings that silently break requests cannot drift back:
#
#   1. The :80 -> :443 redirect returns 308, not 301. A 301 or 302 lets the
#      client re-issue the request as GET and drop the body, so a POST to
#      http:// arrives as a GET and dies with MethodNotAllowedHttpException.
#      Measured end to end against this app -- through a 301 the request lands
#      as GET and 405s; through a 308 it lands as POST and reaches the
#      controller.
#   2. The PHP location includes fastcgi_params. Without it nginx forwards
#      almost no CGI variables, REQUEST_URI among them, so Laravel resolves
#      every request as "/" and quietly serves the welcome page with a 200.
#
# Placeholders to fill in: server_name, the certificate paths, and the PHP-FPM
# socket if you are not on the packaged php8.2-fpm.
#
# IPv4 only by default. A `listen [::]:80;` on a host without IPv6 fails the
# config test outright -- "socket() [::]:80 failed (97: Address family not
# supported by protocol)" -- so the IPv6 lines are commented out rather than
# left for the reader to remove. Uncomment both if the host has IPv6.
#
# Install:
#   sudo cp deploy/nginx/breakout-api.conf /etc/nginx/sites-available/breakout-api
#   sudo ln -s /etc/nginx/sites-available/breakout-api /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    # listen [::]:80;          # uncomment only if the host has IPv6
    server_name api.example.com;

    # 308, not 301: preserves the method and body across the upgrade. Clients
    # should still be pointed at https:// directly -- a redirected POST costs
    # a wasted round trip even when the status code is method-preserving.
    return 308 https://$host$request_uri;
}

server {
    # HTTP/2 is spelled differently across versions and is deliberately left
    # off here so this file loads anywhere: `http2 on;` needs nginx >= 1.25.1,
    # while older builds want `listen 443 ssl http2;`. Check `nginx -v` and add
    # whichever your build takes.
    listen 443 ssl;
    # listen [::]:443 ssl;     # uncomment only if the host has IPv6
    server_name api.example.com;

    # Laravel's front controller lives in public/, never the repo root.
    root /var/www/breakout/apps/api/public;
    index index.php;

    ssl_certificate     /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;

    charset utf-8;

    # Login and refresh bodies are small; the cap is for uploads elsewhere.
    client_max_body_size 20M;

    access_log /var/log/nginx/breakout-api.access.log;
    error_log  /var/log/nginx/breakout-api.error.log;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # CORS is handled by App\Http\Middleware\ConfigureCors, driven by
    # CORS_ALLOWED_ORIGINS in apps/api/.env. Do not add CORS headers here as
    # well -- duplicated Access-Control-Allow-Origin headers make browsers
    # reject the response outright.

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # No $uri/ here. Nothing under public/ is a real directory that should be
    # served, and $uri/ makes nginx 301 to add a trailing slash -- another way
    # to turn a POST into a GET.
    location / {
        try_files $uri /index.php?$query_string;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;

        # Order matters: include the defaults first, then override. This line
        # carries REQUEST_METHOD, REQUEST_URI, QUERY_STRING, CONTENT_TYPE and
        # the HTTP_* headers through to PHP. Drop it and the failure is silent
        # rather than loud -- Laravel sees no REQUEST_URI, routes everything to
        # "/", and returns 200 for every endpoint in the API.
        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT   $realpath_root;

        # Laravel reads the bearer token off this. Some PHP-FPM builds strip
        # Authorization before it reaches the script.
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;

        fastcgi_hide_header X-Powered-By;
        internal;
    }

    # Anything else ending in .php is not ours -- refuse rather than execute.
    location ~ \.php$ {
        return 404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
