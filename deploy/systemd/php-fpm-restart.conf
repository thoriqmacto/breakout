# Bring PHP-FPM back after it is killed.
#
# Ubuntu's packaged php*-fpm.service sets no Restart=, so a process the kernel
# kills stays dead until somebody notices. Somebody noticed twelve hours later,
# via a CORS error: nginx survives the death of its upstream and answers 502,
# a 502 carries no Access-Control-Allow-Origin, and a browser cannot report
# anything about a preflight except that the header is missing. The API was
# down the whole time and nothing said so.
#
# The kill itself was the out-of-memory killer. That is worth preventing
# separately -- see "When the API returns 502" in the README -- but it is not
# worth being unreachable over: coming back in five seconds turns an outage
# into a blip, whatever killed it.
#
# Deliberately not Restart=always: a unit that cannot start at all (a syntax
# error in a pool config, a missing socket directory) should stop and stay
# stopped where it can be seen, rather than restarting forever. on-failure
# covers the kills and the crashes, which is the case this exists for.
#
# Install, substituting the PHP version actually on the box:
#
#   sudo mkdir -p /etc/systemd/system/php8.3-fpm.service.d
#   sudo cp deploy/systemd/php-fpm-restart.conf \
#           /etc/systemd/system/php8.3-fpm.service.d/restart.conf
#   sudo systemctl daemon-reload
#   sudo systemctl start php8.3-fpm
#
# Verify it took, without waiting for the next kill:
#
#   systemctl show php8.3-fpm -p Restart -p RestartUSec
#   sudo systemctl kill -s SIGKILL php8.3-fpm && sleep 8 && systemctl is-active php8.3-fpm

[Unit]
# Give up only if it is failing constantly, which means restarting cannot fix
# it and something has to look. These two are [Unit] options, not [Service]
# ones -- they moved in systemd 229 and are silently ignored in the wrong
# section, which would leave the restart unbounded rather than unconfigured.
StartLimitIntervalSec=300
StartLimitBurst=5

[Service]
Restart=on-failure
RestartSec=5s

# What happens when the kernel kills something inside this unit's cgroup. The
# master being killed is a failure either way and Restart= above brings it
# back; this is about a *worker* being the one killed, which php-fpm handles
# by respawning it. The alternative, stop, would tear down a healthy pool
# because one request was expensive.
OOMPolicy=continue
